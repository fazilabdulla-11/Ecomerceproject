{% extends 'base.html' %}
{% block title %}Home{% endblock %}
{% block content %}

<div class="container mt-5">
    <h1 class="text-center mb-4">{{p.name}} Details</h1>
    <div class="row">
        <div class="col-md-6">
            <div class="text-center">
                <img src="{{ p.image.url}}" class="img-fluid rounded" style="max-height: 500px; width: auto; object-fit: cover;" alt="{{p.name}}">
            </div>
        </div>
        <div class="col-md-6">
            <div class="product-info">
                <h2 class="mb-3">{{ p.name }}</h2>
                <p><strong>Brand:</strong> {{p.brand}}</p>
                <p><strong>Category:</strong> {{ p.category}}</p>
                <p><strong>Price:</strong> $ {{ p.price }}</p>
                <p><strong>About Product:</strong> {{ p.description}}</p>
                <p><strong>Gender:</strong> {{ p.gender}}</p>
            </div>
            <div class="mt-4">
                <a href="{% url 'buy.html' p.id %}" class="btn btn-primary me-2">Buy Now</a>
                <a href="{% url 'add_to_cart' p.id %}" class="btn btn-secondary">Add to Cart</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
